name: Documentation improvement
description: Propose clearer coverage, a new supported workflow, or a version-policy update.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: topic
    attributes:
      label: Topic
      placeholder: Partition lifecycle, query routing, clone-node scale-out, or another Citus topic
    validations:
      required: true

  - type: textarea
    id: gap
    attributes:
      label: Current gap
      description: Describe what a user or Codex cannot decide safely with the current material.
    validations:
      required: true

  - type: textarea
    id: sources
    attributes:
      label: Official sources and versions
      description: Link the Citus/PostgreSQL release documentation or provide runtime evidence.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Include risk classification, capability checks, validation, and rollback implications where relevant.
    validations:
      required: true
